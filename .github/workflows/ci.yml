name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Integration and concurrency tests run against the production major
      # version of PostgreSQL (the local compose file may lag behind).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: paybridge
          POSTGRES_PASSWORD: paybridge
          POSTGRES_DB: paybridge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U paybridge -d paybridge"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paybridge/api db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Includes test/payment-core/concurrency.int-spec.ts (two real connections).
      - run: pnpm test:int
      # The Console (Next.js): production build, then Playwright against it in mock mode.
      - run: pnpm turbo run build --filter=@paybridge/console
      - run: pnpm --filter @paybridge/console exec playwright install --with-deps chromium
      - run: pnpm turbo run test:e2e --filter=@paybridge/console
